<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Creator account harness</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui; background: #111827; color: #f9fafb; }
    body { max-width: 900px; margin: 3rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 1rem; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 1.25rem; }
    label { display: block; margin: .7rem 0; } input { display: block; width: 95%; padding: .5rem; }
    button { background: #7c3aed; color: white; border: 0; border-radius: 8px; padding: .7rem 1rem; cursor: pointer; }
    pre { white-space: pre-wrap; color: #a7f3d0; } code { color: #fde68a; }
  </style>
</head>
<body>
  <h1>Creator account test surface</h1>
  <p>Isolated in-memory data. Demo login: <code>demo_creator</code> / <code>correct horse battery staple</code>.</p>
  <div class="grid">
    <form class="card" data-action="register"><h2>Register</h2>
      <label>Username<input name="username" value="new_creator"></label>
      <label>Display name<input name="displayName" value="New Creator"></label>
      <label>Password<input name="password" type="password" value="a secure demo password"></label>
      <button>Create account</button>
    </form>
    <form class="card" data-action="login"><h2>Log in</h2>
      <label>Username<input name="username" value="demo_creator"></label>
      <label>Password<input name="password" type="password" value="correct horse battery staple"></label>
      <button>Log in</button>
    </form>
  </div>
  <section class="card"><button id="me">Check session</button> <button id="logout">Log out</button>
    <pre id="result">Choose an action.</pre></section>
  <script type="module">
    const output = document.querySelector('#result');
    async function call(path, options) {
      const response = await fetch(path, options); const body = response.status === 204 ? null : await response.json();
      output.textContent = `${response.status}\n${JSON.stringify(body, null, 2)}`;
    }
    for (const form of document.querySelectorAll('form')) form.addEventListener('submit', (event) => {
      event.preventDefault(); const value = Object.fromEntries(new FormData(form));
      call(`/api/auth/${form.dataset.action}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(value) });
    });
    document.querySelector('#me').onclick = () => call('/api/auth/me');
    document.querySelector('#logout').onclick = () => call('/api/auth/logout', { method: 'POST' });
  </script>
</body>
</html>
